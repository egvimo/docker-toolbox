name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-matrix:
    name: Generate Matrix
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.matrix.outputs.dockerfiles }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build matrix from Dockerfiles
        id: matrix
        run: |
          set -euo pipefail
          DOCKERFILES=$(find ./docker -maxdepth 1 -name "*.Dockerfile" | sed 's|./docker/||')
          MATRIX=$(echo "$DOCKERFILES" | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "Matrix: $MATRIX"
          echo "dockerfiles=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.generate-matrix.outputs.dockerfiles) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  tag:
    name: Tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run tagging script
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            python ci/create_git_tag.py
          else
            python ci/create_git_tag.py --dry-run
          fi
