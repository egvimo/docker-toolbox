name: Publish

on:
  push:
    tags:
      - '*'
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  generate-tags:
    name: Generate Tags
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Collect tags
        id: tags
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAGS='["${{ github.ref_name }}"]'
          else
            git fetch --tags
            TAGS=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" \
              | jq -R -s -c 'split("\n") | map(select(length>0))')
          fi

          echo "Resolved tags: $TAGS"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: generate-tags
    if: ${{ needs.generate-tags.outputs.tags != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.generate-tags.outputs.tags) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract image and version
        id: image
        run: |
          TAG="${{ matrix.tag }}"

          if [[ ! "$TAG" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Tag '$TAG' must match '<image>-X.Y.Z'"
            exit 1
          fi

          IMAGE="${TAG%-*}"
          VERSION="${TAG##*-}"

          echo "name=$IMAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/egvimo/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ steps.image.outputs.name }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}.Dockerfile
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.name }}.Dockerfile
